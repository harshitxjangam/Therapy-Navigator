[theme]
primaryColor = "#4A6D3F"
backgroundColor = "#F9EFD4"
secondaryBackgroundColor = "#FFFAEB"
textColor = "#3A2E1F"
font = "sans serif"

[client]
# Hides the Deploy button and developer menu items — this is a demo app, not a
# dev environment. Set at the server level so it applies before first paint.
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false
